const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(DATA.s), iterations: DATA.it, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(DATA.i) }, key, u8(DATA.c));
  sessionStorage.setItem("t4l-gate", pass);
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
const saved = sessionStorage.getItem("t4l-gate");
if (saved) tryOpen(saved).catch(() => sessionStorage.removeItem("t4l-gate"));
document.getElementById("g").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.style.display = "none";
  try { await tryOpen(document.getElementById("pw").value); }
  catch (e) { err.style.display = "block"; btn.disabled = false; }
});
